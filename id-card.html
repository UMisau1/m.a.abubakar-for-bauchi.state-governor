<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Membership ID Card | M.A. ABUBAKAR, SAN, Campaign</title>

<link rel="stylesheet"
href="css/style.css">

<link rel="stylesheet"
href="css/id-card.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="id-container">

<div class="id-card">

<!-- Header -->

<div class="id-header">

<img src="images/apc-logo.png"
class="logo"
alt="APC Logo">

<div>

<h2>MOHAMMED ABDULLAHI ABUBAKAR, SAN, SUPPORT CAMPAIGN</h2>

<p>Official Membership ID Card</p>

</div>

</div>

<!-- Body -->

<div class="id-body">

<div class="photo">

<img id="memberPhoto"

src="images/default-user.png"

alt="Member Photo">

</div>

<div class="member-details">

<h3 id="memberName">

Full Name

</h3>

<p>

<strong>ID No:</strong>

<span id="memberID">

M.A.-2027-000001

</span>

</p>

<p>

<strong>State:</strong>

<span id="memberState">

Bauchi

</span>

</p>

<p>

<strong>LGA:</strong>

<span id="memberLGA">

Misau

</span>

</p>

<p>

<strong>Ward:</strong>

<span id="memberWard">

Hardawa Ward

</span>

</p>

</div>

</div>

<!-- QR -->

<div class="qr-section">

<img

src="images/qrcode.png"

alt="QR Code"

class="qr">

</div>

<!-- Footer -->

<div class="id-footer">

<p>

Valid Official Membership Card

</p>

</div>

</div>

<div class="buttons">

<button
onclick="window.print()"
class="btn btn-primary">

<i class="fas fa-print"></i>

Print Card

</button>

<button
id="downloadCard"
class="btn btn-outline">

<i class="fas fa-download"></i>

Download Card

</button>

</div>

</div>

<script src="js/id-card.js"></script>

</body>

</html>
